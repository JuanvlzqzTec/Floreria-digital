services:
  mysql_db:
    image: mysql:8.0
    container_name: floreria_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: floreria_db
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - floreria_network
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  api_tienda:
    build: ./api_tienda
    container_name: floreria_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: mysql_db
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: floreria_db
      JWT_SECRET: Sistema1234
    depends_on:
      mysql_db:
        condition: service_healthy
    networks:
      - floreria_network

  cliente_tienda:
    build: ./cliente_tienda
    container_name: floreria_cliente
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api_tienda
    networks:
      - floreria_network

networks:
  floreria_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local